name: ZFS Manager regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Python regression (offline fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Confirm runner tools
        run: |
          node --version
          perl -e 'print "Perl $^V\n"'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Check quick installer shell syntax
        run: bash -n quick-install.sh bootstrap-rc9.sh install-local.sh install.sh build_deb.sh

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Install fakeroot for root-ownership test fixture
        run: |
          if ! command -v fakeroot >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fakeroot
          fi

      - name: Run regression suite as normal user (no Proxmox host)
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
        run: python -m pytest -q tests -k "not test_offline_helper_rejects_modified_or_mounted_snapshot and not test_monitor_critical_is_repeated_but_not_each_five_minutes and not test_monitor_notify_failure_retries_next_tick and not test_previous_quota_alarm_is_discarded_without_recovery_spam and not test_real_pool_alarm_unchanged_with_no_target"

      - name: Run offline rescue test with simulated root-owned fixtures
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
        run: >-
          fakeroot python -m pytest -q
          tests/test_installer.py::RC9RequirementsTest::test_offline_helper_rejects_modified_or_mounted_snapshot
          tests/test_notifications_v134_rc2.py::test_monitor_critical_is_repeated_but_not_each_five_minutes
          tests/test_notifications_v134_rc2.py::test_monitor_notify_failure_retries_next_tick
          tests/test_pool_only_v134_rc4.py::test_previous_quota_alarm_is_discarded_without_recovery_spam
          tests/test_pool_only_v134_rc4.py::test_real_pool_alarm_unchanged_with_no_target
          tests/test_autosnap_mandatory_v134_rc5.py tests/test_unzip_bootstrap_rc7.py
          tests/test_cluster_install.py::test_cluster_root_owned_store_and_single_controller_lock
