name: ZFS Manager regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Python regression (offline fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Confirm runner tools
        run: |
          node --version
          perl -e 'print "Perl $^V\n"'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Check quick installer shell syntax
        run: bash -n quick-install.sh

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Install fakeroot for root-ownership test fixture
        run: |
          if ! command -v fakeroot >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fakeroot
          fi

      - name: Run regression suite as normal user (no Proxmox host)
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
        run: python -m pytest -q tests -k "not test_offline_helper_rejects_modified_or_mounted_snapshot"

      - name: Run offline rescue test with simulated root-owned fixtures
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
        run: fakeroot python -m pytest -q tests/test_installer.py::RC9RequirementsTest::test_offline_helper_rejects_modified_or_mounted_snapshot
