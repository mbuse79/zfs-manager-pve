name: ZFS Manager regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Python regression (offline fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Confirm runner tools
        run: |
          node --version
          perl -e 'print "Perl $^V\n"'

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Check Python syntax
        run: python -m compileall -q src tests

      - name: Run existing regression suite (no Proxmox host)
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tests
        run: python -m pytest -q tests
